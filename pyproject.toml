[project]
name = "deep-sound"
version = "0.0.1"
description = "Source-aware music similarity desktop application"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "deep-sound contributors" }]
dependencies = [
    "click>=8.1",
    "numpy>=1.26",
    "librosa>=0.10",
    "soundfile>=0.12",
]

[project.optional-dependencies]
demucs = ["demucs>=4.0", "torch>=2.0", "torchaudio>=2.0", "torchcodec>=0.12"]
ui = ["PySide6>=6.6"]
index = ["faiss-cpu>=1.7"]
mir = ["essentia>=2.1b6.dev1110; platform_system != 'Windows'"]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-click",
]

[project.scripts]
deep-sound = "deep_sound.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_sound"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/deep_sound"]
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["librosa.*", "soundfile.*", "faiss.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-click",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", extra = "demucs" }
torchaudio = { index = "pytorch-cpu", extra = "demucs" }
